spring:
  application:
    name: svc-academico

  datasource:
    # La URL se compone a partir de DB_HOST, DB_PORT y DB_NAME para que la MISMA
    # variable que publica el puerto en docker-compose apunte tambien la aplicacion.
    # Si gobernaran variables distintas, cambiar el puerto del contenedor dejaria a la
    # aplicacion apuntando a otra base: un fallo silencioso y dificil de diagnosticar.
    # DB_URL sigue disponible para sobreescribir la URL completa en un despliegue.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vista360_academico}}
    username: ${DB_USER:vista360}
    password: ${DB_PASSWORD:vista360}

  jpa:
    # Se desactiva a proposito: mantener la sesion abierta durante el renderizado de la
    # respuesta esconde problemas N+1 y alarga las transacciones. Todo lo que la vista
    # necesita se carga explicitamente en el repositorio.
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway. Hibernate solo verifica que coincida y falla
      # al arrancar si alguien cambio una entidad sin escribir su migracion.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    co.edu.icesi.vista360: INFO
